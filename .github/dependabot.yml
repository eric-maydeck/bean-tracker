version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Majors need a migration; security updates still arrive. Revisit in the upgrade backlog item.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Majors need a migration; security updates still arrive. Revisit in the upgrade backlog item.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
