version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Majors need a migration; security updates still arrive. Revisit in the upgrade backlog item.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 1.65's Firefox build 1572 crashes pages ("Page crashed", microsoft/playwright#43967); fixed upstream, unreleased.
      # Drop this once a release past 1.65.1 ships a newer Firefox build.
      - dependency-name: "@playwright/test"
        versions: ["1.65.x"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Majors need a migration; security updates still arrive. Revisit in the upgrade backlog item.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
