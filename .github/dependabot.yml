version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # svelte-check and SvelteKit don't accept TypeScript 7 yet; drop this in #168.
      - dependency-name: "typescript"
        versions: [">=7"]
      # 1.65's Firefox build 1572 crashes pages ("Page crashed", microsoft/playwright#43967); fixed upstream, unreleased.
      # Drop this once a release past 1.65.1 ships a newer Firefox build.
      - dependency-name: "@playwright/test"
        versions: ["1.65.x"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
