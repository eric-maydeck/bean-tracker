name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [release]

# Releases come only from the `release` branch: promote with `git push origin main:release`.
# Pushing two commits close together used to make this fail outright:
# a Release run for the OLDER commit could still be starting after the branch
# had already moved past it (a newer commit's CI had already completed),
# and semantic-release aborts with "local branch is behind remote" rather
# than publish from a non-HEAD commit. Cancelling the stale run instead of
# letting it race the newer one — combined with always checking out `release`
# below instead of the pinned commit that triggered the run — means
# whichever run survives always builds off the real current tip.
concurrency:
  group: release-branch
  cancel-in-progress: true

jobs:
  release:
    # Only a push to this repo's own release branch may start a release, never a fork's PR run.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release
          fetch-depth: 0

      # The built-in secrets.GITHUB_TOKEN can't be used here: GitHub does not
      # raise `release: published` for events created by that token, so
      # publish-image.yml would never fire. A GitHub App installation token
      # doesn't have that restriction and needs no long-lived credential.
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # A workflow_run job runs in the default branch's context (GITHUB_REF = main), and
      # semantic-release reads the branch from GITHUB_REF, so it refused to publish ("triggered on
      # the branch main"). Point it at the branch actually checked out.
      - run: GITHUB_REF=refs/heads/release npx semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # The bot's release-commit push must not run the local husky pre-push gate (full test:ui).
          HUSKY: '0'

      - name: Back-merge release into main
        env:
          HUSKY: '0'
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          .github/back-merge-release.sh
