name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, release]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npx svelte-check --threshold error

  ui-full:
    # release gating off until Linux runs are green
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        viewport: [w360, w390, w480, w768, w1280, phone-portrait, phone-landscape]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npx svelte-kit sync
      - run: npx playwright install --with-deps firefox
      # balanced = 4 workers, matching the 4-vCPU runner (performance's 9 overloads it).
      - run: npm run test:ui:prod
        env:
          UI_SHOTS: off
          UI_PROFILE: balanced
          UI_VIEWPORTS: ${{ matrix.viewport }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.viewport }}
          path: |
            playwright-report/
            .ui-test/results/
