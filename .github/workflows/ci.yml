name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, release]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # No paths-ignore: a docs-only PR still gets its (instant) green check.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npx svelte-check --threshold error

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # CLI via the official image (gitleaks-action needs a license in some setups).
      # Scans full git history; any finding fails the job.
      - run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.0 \
            git /repo --redact --verbose

  npm-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # No --omit=dev: SvelteKit/Vite/etc. are devDependencies but get bundled into the server build.
      # Skips the Kit remote-function form DoS advisory (#91) (no 2.x fix; the app has no remote functions).
      # Remove ALLOW and go back to plain `npm audit --audit-level=high` with the Kit 3 migration (#68).
      # GHSA-fc5q-39xc-vjpf: picomatch ReDoS, no patched release yet; build tooling only (not in the server bundle).
      # Remove it once picomatch ships a fix (#90). Every ALLOW entry has a child issue under #89.
      - env:
          ALLOW: GHSA-3r8g-jcqq-3p5j GHSA-fc5q-39xc-vjpf
        run: |
          npm audit --json > audit.json || true
          node -e '
            const a = JSON.parse(require("fs").readFileSync("audit.json"));
            const allow = process.env.ALLOW.split(" ");
            const bad = Object.values(a.vulnerabilities).flatMap(v => v.via)
              .filter(x => typeof x === "object" && ["high", "critical"].includes(x.severity))
              .filter(x => !allow.some(id => x.url.endsWith(id)));
            for (const x of bad) console.log(`${x.severity} ${x.name} ${x.title} ${x.url}`);
            process.exit(bad.length ? 1 : 0);
          '

  ui-full:
    concurrency:
      group: ui-full-${{ github.ref }}-${{ matrix.viewport }}-${{ matrix.part }}
      cancel-in-progress: true
    if: github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        viewport: [w360, w390, w480, w768, phone-portrait, phone-landscape]
        part: ['1/1']
        include:
          # w1280 is the slowest viewport: two halves of its states (UI_PART; Playwright's --shard can't split a project chain).
          - { viewport: w1280, part: '1/2' }
          - { viewport: w1280, part: '2/2' }
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npx svelte-kit sync
      - run: npx playwright install --with-deps firefox
      # balanced = 4 workers, matching the 4-vCPU runner (performance's 9 overloads it).
      - run: npm run test:ui:prod
        env:
          # The seed and the states assume the brewing zone; the runner is UTC, which adds a " UTC" suffix to times.
          TZ: America/Denver
          UI_SHOTS: off
          UI_PROFILE: balanced
          UI_VIEWPORTS: ${{ matrix.viewport }}
          UI_PART: ${{ matrix.part }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.viewport }}-${{ strategy.job-index }}
          path: |
            playwright-report/
            .ui-test/results/

  # The UI tests this PR's diff reaches (scripts/test-changed.ts: the matching route tags), one job per viewport like ui-full.
  ui-changed:
    concurrency:
      group: ui-changed-${{ github.ref }}-${{ matrix.viewport }}-${{ matrix.part }}
      cancel-in-progress: true
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        viewport: [w360, phone-portrait]
        part: ['1/1']
        include:
          - { viewport: w1280, part: '1/2' }
          - { viewport: w1280, part: '2/2' }
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npx svelte-kit sync
      - run: npx playwright install --with-deps firefox
      - run: node scripts/test-changed.ts -- $(git diff --name-only origin/${{ github.base_ref }}...HEAD)
        env:
          TZ: America/Denver
          UI_VIEWPORTS: ${{ matrix.viewport }}
          UI_PART: ${{ matrix.part }}
          UI_BUILD: prod
          UI_SHOTS: off
          UI_PROFILE: balanced

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-changed-${{ matrix.viewport }}-${{ strategy.job-index }}
          path: |
            playwright-report/
            .ui-test/results/
