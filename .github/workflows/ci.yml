name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, release]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npx svelte-check --threshold error

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # CLI via the official image (gitleaks-action needs a license in some setups).
      # Scans full git history; any finding fails the job.
      - run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.0 \
            git /repo --redact --verbose

  npm-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # No --omit=dev: SvelteKit/Vite/etc. are devDependencies but get bundled into the server build.
      - run: npm audit --audit-level=high

  ui-full:
    concurrency:
      group: ui-full-${{ github.ref }}-${{ matrix.viewport }}-${{ matrix.part }}
      cancel-in-progress: true
    if: github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        viewport: [w360, w390, w480, w768, phone-portrait, phone-landscape]
        part: ['1/1']
        include:
          # w1280 is the slowest viewport: two halves of its states (UI_PART; Playwright's --shard can't split a project chain).
          - { viewport: w1280, part: '1/2' }
          - { viewport: w1280, part: '2/2' }
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npx svelte-kit sync
      - run: npx playwright install --with-deps firefox
      # balanced = 4 workers, matching the 4-vCPU runner (performance's 9 overloads it).
      - run: npm run test:ui:prod
        env:
          # The seed and the states assume the brewing zone; the runner is UTC, which adds a " UTC" suffix to times.
          TZ: America/Denver
          UI_SHOTS: off
          UI_PROFILE: balanced
          UI_VIEWPORTS: ${{ matrix.viewport }}
          UI_PART: ${{ matrix.part }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.viewport }}-${{ strategy.job-index }}
          path: |
            playwright-report/
            .ui-test/results/
