name: Publish Image

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (arm64, loaded locally for scanning)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ghcr.io/eric-maydeck/bean-tracker:scan
          cache-to: type=gha,mode=max
          cache-from: type=gha

      # Blocks the push below on fixable HIGH/CRITICAL findings in the arm64 image the Pi runs.
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/eric-maydeck/bean-tracker:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # Same build, served from cache; runs only if the scan passed.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          cache-from: type=gha
          tags: |
            ghcr.io/eric-maydeck/bean-tracker:latest
            ghcr.io/eric-maydeck/bean-tracker:${{ github.event.release.tag_name }}
